---
repos:
  - repo: https://github.com/kellerlabs/pre-commit-hooks
    rev: pre-commit-hooks-v0.3.0
    hooks:
      - id: optimize-images
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args:
          - --maxkb=1000
